name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install
      - run: npx tsc --noEmit

      - name: smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js --list --top 5
          node dist/cli.js --list --flat --top 3
          node dist/cli.js --json --top 3 > /dev/null
          node dist/cli.js --kill definitely-no-such-process || test $? -eq 1

      - name: the collector must actually see this machine's processes
        run: |
          count=$(node dist/cli.js --json --top 100 | node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => { raw += chunk; });
            process.stdin.on('end', () => {
              const groups = JSON.parse(raw);
              const procs = groups.flatMap((group) => group.processes);
              const named = procs.filter((proc) => proc.command && proc.pid > 0);
              if (named.length !== procs.length) throw new Error('unnamed or invalid pids');
              console.log(procs.length);
            });
          ")
          echo "collected $count processes"
          test "$count" -gt 10
